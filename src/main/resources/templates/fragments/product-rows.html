<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment for the complete products section with table and form -->
<div th:fragment="rows" class="products-section">
    
    <!-- Products Table -->
    <div class="table-section" style="margin-bottom: 2rem;">
        <div class="table-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>Products</h2>
            <sl-button 
                variant="default" 
                size="small"
                hx-post="/products/refresh"
                hx-target="#products-container"
                hx-indicator="#refresh-indicator">
                <sl-icon slot="prefix" name="arrow-clockwise"></sl-icon>
                Refresh from API
            </sl-button>
        </div>
        
        <div id="refresh-indicator" class="htmx-indicator" style="text-align: center; margin-bottom: 1rem;">
            <sl-spinner></sl-spinner> Refreshing products from external API...
        </div>
        
        <div th:if="${rows.empty}" class="empty-state" style="text-align: center; padding: 2rem;">
            <sl-icon name="inbox" style="font-size: 3rem; color: var(--sl-color-neutral-400);"></sl-icon>
            <p style="color: var(--sl-color-neutral-600); margin-top: 1rem;">No products found. Try refreshing from the API.</p>
        </div>
        
        <div th:if="${not rows.empty}">
            <sl-table>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Handle</th>
                            <th>Vendor</th>
                            <th>Variants</th>
                            <th>Total Price Range</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${rows}">
                            <td th:text="${product.id}">1</td>
                            <td th:text="${product.title}">Product Title</td>
                            <td>
                                <sl-tag variant="neutral" size="small" th:text="${product.handle}">handle</sl-tag>
                            </td>
                            <td th:text="${product.vendor ?: 'N/A'}">Vendor</td>
                            <td>
                                <sl-badge variant="primary" th:text="${product.variants.size()}">0</sl-badge>
                            </td>
                            <td>
                                <span th:if="${not product.variants.empty}">
                                    <span th:with="prices=${product.variants.![T(java.math.BigDecimal).valueOf(T(Double).parseDouble(price))]}">
                                        $<span th:text="${#aggregates.min(prices)}">0.00</span> - 
                                        $<span th:text="${#aggregates.max(prices)}">0.00</span>
                                    </span>
                                </span>
                                <span th:if="${product.variants.empty}">N/A</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </sl-table>
        </div>
    </div>
    
    <!-- Add Product Form -->
    <div class="form-section">
        <sl-card>
            <div slot="header">
                <h3>
                    <sl-icon name="plus-circle" style="margin-right: 0.5rem;"></sl-icon>
                    Add New Product
                </h3>
            </div>
            
            <form hx-post="/products" 
                  hx-target="#products-container"
                  hx-indicator="#form-indicator"
                  style="display: grid; gap: 1rem;">
                
                <sl-input 
                    name="title" 
                    label="Product Title" 
                    placeholder="Enter product title"
                    required>
                </sl-input>
                
                <sl-input 
                    name="handle" 
                    label="Product Handle" 
                    placeholder="product-handle (optional)"
                    help-text="Leave empty to auto-generate from title">
                </sl-input>
                
                <div style="display: flex; gap: 1rem; align-items: end;">
                    <sl-button 
                        variant="primary" 
                        type="submit"
                        style="flex: 1;">
                        <sl-icon slot="prefix" name="plus"></sl-icon>
                        Add Product
                    </sl-button>
                    
                    <sl-button 
                        variant="default" 
                        type="reset">
                        <sl-icon slot="prefix" name="arrow-counterclockwise"></sl-icon>
                        Reset
                    </sl-button>
                </div>
                
                <div id="form-indicator" class="htmx-indicator" style="text-align: center; margin-top: 1rem;">
                    <sl-spinner></sl-spinner> Adding product...
                </div>
            </form>
        </sl-card>
    </div>
    
</div>

</body>
</html>
