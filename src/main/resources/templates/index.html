<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog App</title>
    
    <!-- Web Awesome CDN -->
    <link rel="stylesheet" href="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/styles/webawesome.css" />
    <script type="module" src="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/webawesome.loader.js"></script>

    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.6"></script>
    
    <!-- Custom Components CSS -->
    <link rel="stylesheet" th:href="@{/css/components.css}" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🛍️ Product Catalog App</h1>
            <p>Manage your product catalog with ease</p>
        </header>
        
        <main class="main-content">
            <div class="load-section">
                <wa-button 
                    variant="primary" 
                    size="large"
                    hx-get="/products"
                    hx-target="#products-container"
                    hx-indicator="#loading-indicator"
                    hx-swap="innerHTML">
                    Load Products
                </wa-button>
            </div>
            
            <div id="loading-indicator">
                <div th:replace="~{components/loading-spinner :: spinner('Loading products...')}"></div>
            </div>
            
            <div id="products-container" class="products-container">
                <!-- Products table and form will be loaded here via HTMX -->
            </div>
        </main>
    </div>
</body>
</html>
